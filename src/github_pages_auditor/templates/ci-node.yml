# Generado por github-pages-auditor: es un punto de partida, ajústalo a tu proyecto.
name: CI
on:
  push:
    branches: ["{rama}"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Instalar dependencias
        run: npm ci || npm install
      - name: Build
        run: npm run build --if-present
      - name: Tests
        run: npm test --if-present
