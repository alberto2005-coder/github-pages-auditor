# Generado por github-pages-auditor: es un punto de partida, ajústalo a tu proyecto.
name: CI
on:
  push:
    branches: ["{rama}"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test ./...
