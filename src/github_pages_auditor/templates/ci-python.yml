# Generado por github-pages-auditor: es un punto de partida, ajústalo a tu proyecto.
name: CI
on:
  push:
    branches: ["{rama}"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Comprobar que el código compila
        run: python -m compileall -q .
      - name: Tests
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo "No hay carpeta tests"; fi
