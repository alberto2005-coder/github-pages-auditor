[project]
name = "ver-github-pages"
version = "1.1.0"
description = "High-performance CLI auditor for GitHub repositories, Pages, and releases (API & scraping support)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alberto Ortiz", email = "albertoortixsanchez@gmail.com" }
]
maintainers = [
    { name = "Alberto Ortiz" }
]
keywords = ["github", "github-pages", "auditor", "cli", "scraping", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/ver-github-pages"
Repository = "https://github.com/alberto2005-coder/ver-github-pages"
Issues = "https://github.com/alberto2005-coder/ver-github-pages/issues"
Author = "https://github.com/alberto2005-coder/"
Website = "https://albertoortiz.is-a.dev/"

[project.scripts]
ver-github-pages = "ver_github_pages.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
