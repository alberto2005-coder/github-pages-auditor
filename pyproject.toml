[project]
name = "github-pages-auditor"
version = "1.4.0"
description = "Audit every public repo of a GitHub user in one command: Pages health, releases and quality checks. JSON/Markdown output and CI exit codes. Works with or without a token."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto Ortiz" }
]
maintainers = [
    { name = "Alberto Ortiz" }
]
keywords = ["github", "github-pages", "auditor", "cli", "ci", "json", "repository-health", "portfolio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=15.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/github-pages-auditor"
Repository = "https://github.com/alberto2005-coder/github-pages-auditor"
Issues = "https://github.com/alberto2005-coder/github-pages-auditor/issues"
Author = "https://github.com/alberto2005-coder/"
Website = "https://albertoortiz.is-a.dev/"

[project.scripts]
github-pages-auditor = "github_pages_auditor.main:main"
ver-github-pages = "github_pages_auditor.main:main"  # alias de compatibilidad (v1.0 / v1.1)

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: prueba contra la API real de GitHub (solo con RUN_LIVE=1 y GITHUB_TOKEN)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "I001"]
"src/github_pages_auditor/salidas.py" = ["E501"]  # CSS/JS embebidos

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.coverage.run]
source = ["github_pages_auditor"]
omit = ["*/tui.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
