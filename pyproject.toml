[project]
name = "github-pages-auditor"
version = "1.2.0"
description = "Audit every public repo of a GitHub user in one command: Pages health, releases and quality checks. JSON/Markdown output and CI exit codes. Works with or without a token."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto Ortiz", email = "albertoortixsanchez@gmail.com" }
]
maintainers = [
    { name = "Alberto Ortiz" }
]
keywords = ["github", "github-pages", "auditor", "cli", "ci", "json", "repository-health", "portfolio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/github-pages-auditor"
Repository = "https://github.com/alberto2005-coder/github-pages-auditor"
Issues = "https://github.com/alberto2005-coder/github-pages-auditor/issues"
Author = "https://github.com/alberto2005-coder/"
Website = "https://albertoortiz.is-a.dev/"

[project.scripts]
github-pages-auditor = "github_pages_auditor.main:main"
ver-github-pages = "github_pages_auditor.main:main"  # alias de compatibilidad (v1.0 / v1.1)

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
